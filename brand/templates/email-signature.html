<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dike Industries email signature</title>
<!--
  How to use
  1. Upload brand/icons/email-mark.png to your website and replace the img src below with its full URL.
     The local path only works for previewing this file. Email apps need the logo hosted online.
  2. Replace the bracketed contact fields.
  3. Open this file in a browser, select the signature (everything inside the table), copy,
     and paste it into Gmail (Settings > See all settings > Signature) or Outlook (Settings > Signatures).
  Email apps ignore web fonts, so the name falls back to Arial Narrow and the text to Arial.
-->
</head>
<body style="margin:24px;background:#ffffff;">
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;color:#070809;">
  <tr>
    <td style="padding:0 16px 0 0;vertical-align:top;">
      <img src="../icons/email-mark.png" width="40" height="40" alt="Dike Industries" style="display:block;border:0;">
    </td>
    <td style="padding:0 0 0 16px;border-left:2px solid #8E5329;vertical-align:top;">
      <div style="font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:18px;line-height:20px;letter-spacing:0.5px;text-transform:uppercase;">Emmanuel Udeze</div>
      <div style="font-size:13px;line-height:20px;">Founder, Dike Industries <span style="color:#8E5329;font-family:'Courier New',monospace;font-size:12px;">/dee-keh/</span></div>
      <div style="font-size:12px;line-height:18px;color:#4A4E55;">Engineered from Waste. Built for the Future.</div>
      <div style="font-size:12px;line-height:20px;padding-top:4px;color:#070809;">[email] &nbsp;·&nbsp; [phone] &nbsp;·&nbsp; [website]</div>
    </td>
  </tr>
</table>
</body>
</html>
